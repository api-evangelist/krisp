- product: VIVA Go SDK
  version: 1.4.0
  url: https://sdk-docs.krisp.ai/changelog/viva-go-sdk-v140.md
  breaking: true
  breaking_note: >-
    Requires Krisp VIVA C/C++ SDK v9.19.0 and above; the previous Interrupt Prediction model file is not
    compatible with the new SDK.
  additions:
  - Introduced TTS Detection API.
  - New krisp-viva-vi-tel-v2.1 16 kHz Voice Isolation model optimized for 8–16 kHz telephony.
  highlights:
  - Separated Go SDK UAR (usage auto reporting) and non-UAR builds; new builds no longer require build tags.
  - Reduced CPU consumption for Voice Isolation models by 30–40% on armv8a hardware using FP16 SIMD.
- product: VIVA C/C++ SDK
  version: 9.19.0
  url: https://sdk-docs.krisp.ai/changelog/viva-cc-sdk-v9190.md
  breaking: true
