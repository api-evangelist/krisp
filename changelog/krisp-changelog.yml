- product: RTC JS Browser SDK
  version: 2.3.9
  url: https://sdk-docs.krisp.ai/changelog/rtc-js-sdk-239.md
  breaking: false
  highlights:
  - Improved SharedArrayBuffer fallback — the SDK now detects when SharedArrayBuffer is unavailable and
    automatically falls back to postMessage transport instead of breaking audio processing.
  - Fixed dead mic issue — when Noise Cancellation is enabled mid-call, raw audio is passed through until
    processed audio is ready, preventing the microphone from being muted during filter warm-up. Accent
    Conversion outputs silence during warm-up by design.
  - Fixed a Chrome AudioWorklet race condition — filter creation now retries until the AudioWorklet is
    registered.
  - WASM model and session initialization failures now trigger the filter's error event instead of
    incorrectly reporting the filter as ready; a related memory leak was fixed.
- product: VIVA Python SDK
  version: 1.11.0
  url: https://sdk-docs.krisp.ai/changelog/viva-python-sdk-v1110.md
  breaking: true
  breaking_note: The previous Interrupt Prediction model file is not compatible with the new SDK.
  additions:
  - Introduced stats API.
  highlights:
  - Reduced CPU consumption for Voice Isolation models by 30–40% on armv8a hardware using FP16 SIMD
    instructions where available.
  - Updated the Interrupt Prediction model file krisp-viva-ip-v1.1 with updated model encryption; no
    output quality change.
