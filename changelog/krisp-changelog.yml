  - New krisp-viva-vi-tel-v2.1 16 kHz Voice Isolation model optimized for 8–16 kHz telephony, reducing
    voice suppression and improving WER accuracy over krisp-viva-vi-tel-v2.
  highlights:
  - Reduced CPU consumption for Voice Isolation models by 30–40% on armv8a hardware using FP16 SIMD.
  - Updated the Interrupt Prediction model file krisp-viva-ip-v1.1 with updated model encryption.
