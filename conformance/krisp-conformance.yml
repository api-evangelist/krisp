standards:
- id: oauth2
  conforms: false
  evidence: >-
    No oauth2 security scheme documented; /.well-known/oauth-authorization-server returns 404. Krisp uses
    an account API key that mints short-lived session keys.
- id: oidc
  conforms: false
  evidence: >-
    /.well-known/openid-configuration on developers.krisp.ai returns HTTP 200 but serves the SPA HTML
    shell, not a JSON discovery document.
- id: rfc9457-problem-details
  conforms: false
  evidence: >-
    Errors use a custom {"error": {code, reason, description, reference_id}} envelope, not
    application/problem+json.
- id: rfc9116-security-txt
  conforms: true
  evidence: https://krisp.ai/.well-known/security.txt returns 200 with Contact, Policy, Preferred-Languages,
    and Canonical fields.
- id: rfc9727-api-catalog
  conforms: false
  evidence: /.well-known/api-catalog returns 404 on both krisp.ai and sdk-docs.krisp.ai.
- id: rfc8594-sunset-header
  conforms: false
  evidence: No deprecation policy or Sunset/Deprecation header support published.
- id: rfc5646-bcp47
  conforms: true
  evidence: >-
    Voice Translation source_language / target_language and the list-languages language_code values are
    documented as BCP 47 locale codes, explicitly citing RFC 5646.
- id: rfc6455-websocket
  conforms: true
  evidence: >-
    The Voice Translation streaming API is a WSS connection multiplexing text frames (opcode 0x1) and
    binary frames (opcode 0x2) per RFC 6455.
- id: iso8601-timestamps
  conforms: true
  evidence: Transcript event start and session expires_at are ISO 8601 UTC timestamps.
- id: idempotency
