aid: krisp
name: Krisp
description: 'Krisp is a Voice AI platform whose real-time speech-enhancement models run on over 200 million
  devices, licensed by Discord, Twilio, and VMware among others. Beyond its consumer AI Note Taker, Krisp
  ships a developer surface: the AI Voice SDK family (VIVA for voice AI agents — voice isolation, turn
  prediction, interruption prediction, VAD; and RTC for human-to-human calls — accent conversion,
  bidirectional noise cancellation, background voice cancellation) across Windows, macOS, Linux, Web
  (JS/WASM), iOS, and Android with C++, Python, Node.js, Go, Rust, and JavaScript bindings, plus framework
  integrations for LiveKit, WebRTC, and Pipecat. Krisp also runs a self-serve Voice Translation API — a
  streaming WebSocket speech-to-speech translation service covering 61 languages behind a REST session-token
  mint — and a programmatic SDK and model download REST API for CI/CD pipelines.'
